name: CI

# Runs on every push and pull request. Nothing is deployed here.
on:
  push:
  pull_request:
  workflow_dispatch:   # manual "Run workflow" button

permissions:
  id-token: write   # OIDC login to AWS, no stored access keys
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  changes:
    # Decides whether this commit can change the agent's answers (and so needs the LLM evals).
    runs-on: ubuntu-latest
    outputs:
      llm: ${{ steps.filter.outputs.llm }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            llm:
              - 'agent/**'
              - 'ontology/**'
              - 'evals/**'
              - 'data/**'
              - 'requirements*.txt'

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv pip install --system -r requirements-dev.txt
      - run: ruff check agent evals tests data lambda scripts
      - run: python -m pytest tests -q
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  evals:
    # Scores the agent on the eval suite. Fails below EVAL_BASELINE.
    # Skipped (not failed) when the commit changes no agent, ontology, eval or data code.
    needs: [test, changes]
    if: needs.changes.outputs.llm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv pip install --system -r requirements-evals.txt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: python -m evals.build_golden
      - run: python -m evals.run_evals
        env:
          KNOWLEDGE_BASE_ID: ${{ vars.KNOWLEDGE_BASE_ID }}
          LLM_MODEL_ID: ${{ vars.LLM_MODEL_ID }}
          JUDGE_MODEL_ID: ${{ vars.JUDGE_MODEL_ID }}
          GUARDRAIL_ID: ${{ vars.GUARDRAIL_ID }}
          GUARDRAIL_VERSION: ${{ vars.GUARDRAIL_VERSION }}
          DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
          EVAL_BASELINE: "1.0"
      - name: Eval summary
        if: always()
        run: python -m evals.summary >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results.json

  terraform-plan:
    # Runs only after the evals pass, so infrastructure is planned only for a validated agent.
    needs: [test, evals]
    if: always() && needs.test.result == 'success' && (needs.evals.result == 'success' || needs.evals.result == 'skipped')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform init -input=false
      - run: terraform fmt -check -recursive
      - run: terraform validate
      - run: terraform plan -input=false
